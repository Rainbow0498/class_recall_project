{% extends 'base.html' %}{% block content %}<header class="page-head"><div><h1>确认课程安排</h1><p class="muted">{{ student.name }} · 共 {{ occurrences|length }} 节课，确认后加入课表。</p></div></header><section class="card form-card">{% include 'schedule/occurrences.html' %}<form method="post" class="section">{% csrf_token %}<input type="hidden" name="preview_token" value="{{ preview_token }}"><input type="hidden" name="confirm" value="on">{% if has_conflicts %}<div class="notice"><p>部分课程时段重叠，确认后会同时显示在课表中。</p><label class="check-label"><input type="checkbox" name="accept_conflicts" required>我已查看冲突，仍然添加这些课程</label></div>{% endif %}<div class="actions"><button class="primary">确认添加 {{ occurrences|length }} 节课</button><a class="button" href="{% url 'lesson_new' %}">重新填写</a></div></form></section>{% endblock %}
