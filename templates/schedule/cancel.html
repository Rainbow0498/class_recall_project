{% extends 'base.html' %}{% block content %}<header class="page-head"><h1>取消课程</h1></header><form method="post" class="card form-card">{% csrf_token %}<p>{{ lesson.student.name }} · {{ lesson.date|date:'Y.m.d' }} {{ lesson.start_time|time:'H:i' }}–{{ lesson.end_time|time:'H:i' }}</p><div class="field"><label for="scope">取消范围</label><select name="scope" id="scope"><option value="once">仅本次</option><option value="future">本次及之后（已完成课程除外）</option></select></div><p class="muted">已完成的课程及反馈保持原样，已取消课程可以恢复。</p><div class="actions"><button class="danger" name="confirm" value="on">确认取消</button><a class="button" href="{% url 'lesson_detail' lesson.pk %}">返回课程</a></div></form>{% endblock %}
