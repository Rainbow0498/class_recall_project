{% extends 'base.html' %}{% block content %}<header class="page-head"><h1>彻底删除 {{ student.name }}</h1></header><section class="card danger-zone form-card"><h2>这项操作无法撤销</h2><p>会删除该学生的档案、{{ student.exams.count }} 条考试记录，以及关联的全部课程和课后反馈。</p><p class="muted">如果只是暂时停课，请返回档案使用“停课归档”。</p><form method="post">{% csrf_token %}<label class="check-label"><input type="checkbox" name="confirm" required>我确认删除该学生及全部关联记录</label><div class="actions section"><button class="danger">确认彻底删除</button><a class="button" href="{% url 'student_detail' student.pk %}">返回档案</a></div></form></section>{% endblock %}
